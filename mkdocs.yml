site_name: SEAPATH Documentation
site_description: Open-source hypervisor for IEC 61850 Digital substations
site_url: https://seapath.readthedocs.io/
repo_url: https://github.com/seapath
repo_name: seapath

docs_dir: docs

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - bash
    - python
    - json

plugins:
  - search

hooks:
  - scripts/mkdocs_nav.py

validation:
  nav:
    omitted_files: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

